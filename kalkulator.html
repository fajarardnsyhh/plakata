<html>
<head>

<title>Kalkulator Luas Segitiga</title>
</head>

<body>
<h1>Kalkulator Menghitung Luas Segitiga</h1>

<form>

<label name="tinggi"> Tinggi </label>
<input id="tinggi" name="tinggi" type="number" value="0" /> meter
<br><br>
<label name="alas"> Alas </label>
<input id="alas" name="alas" type="number" value="0" /> meter

<h2>Luas Segitiga = <span id="hasil">0</span> meter</h2>








</form>


<script>



const inputtinggi = document.getElementById("tinggi");
const inputalas = document.getElementById("alas");

// 2. Listen for the 'change' event
inputtinggi.addEventListener("change", function(event) { 


var alas = document.getElementById('alas').value;

console.log("alas = " + alas);
var tinggi = document.getElementById('tinggi').value;

console.log("tinggi = " + tinggi);
var luas = alas * tinggi / 2;

document.getElementById("hasil").innerHTML = "<b>"+luas+"</b>";

console.log("luas = " + luas);

});

inputalas.addEventListener("change", function(event) { 


var alas = document.getElementById('alas').value;

console.log("alas = " + alas);
var tinggi = document.getElementById('tinggi').value;

console.log("tinggi = " + tinggi);
var luas = alas * tinggi / 2;

document.getElementById("hasil").innerHTML = "<b>"+luas+"</b>";

console.log("luas = " + luas);

});


</script>


</body>


</html>
